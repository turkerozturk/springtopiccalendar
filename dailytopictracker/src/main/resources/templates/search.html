<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search notes</title>
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/favicon-180x180.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/manifest.json}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/result-pages.css}">
    <style th:inline="css">body { background-color: /*[[${htmlBackgroundColor}]]*/ #f4f5f7; }</style>
</head>
<body>
<div class="container result-page mt-2">
    <div th:replace="~{fragments/fragnavigation :: fragnavigation}"></div>
</div>
<main class="container result-page my-3">
    <header class="bg-body border rounded p-3 mb-3">
        <h1 class="h3 mb-2">Search notes</h1>
        <nav aria-label="Entry views" class="d-flex flex-wrap gap-2 mb-3">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/entries}">Entries list</a>
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/entry-results/page}">Blog view</a>
        </nav>
        <form th:action="@{/search}" method="get" role="search">
            <input th:if="${pageSize != 10}" type="hidden" name="pageSize" th:value="${pageSize}">
            <label for="note-query" class="form-label mb-1">Search term</label>
            <div class="d-flex flex-wrap gap-2">
                <input name="q" type="search" id="note-query" class="form-control flex-grow-1 w-auto"
                       th:value="${query}" required>
                <button class="btn btn-primary" type="submit">Search</button>
                <a class="btn btn-outline-secondary" th:if="${!query.isEmpty()}" th:href="@{/search}">Clear</a>
            </div>
            <div class="form-check mt-2">
                <input type="checkbox" id="exactMatch" name="exactMatch" value="true"
                       class="form-check-input" th:checked="${exactMatch}">
                <label class="form-check-label" for="exactMatch">Exact match</label>
            </div>
        </form>
    </header>
    <section th:if="${!query.isEmpty()}" aria-label="Note search results">
        <h2 class="h5 bg-body px-3 py-2 rounded" th:text="|Results for “${query}”|"></h2>
        <div th:replace="~{fragments/entry-results :: results}"></div>
    </section>
</main>
<script th:src="@{/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
