<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Topics</title>
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/favicon-180x180.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/manifest.json}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}">
    <style th:inline="css">
        body { background-color: /*[[${htmlBackgroundColor}]]*/ #f4f5f7; }
        .topics-page { max-width: 64rem; overflow-wrap: anywhere; }
        .topic-row { scroll-margin-top: 1rem; }
        .topic-row:target { box-shadow: inset .25rem 0 var(--bs-primary); background: var(--bs-primary-bg-subtle); }
        .topic-identity { min-width: 0; }
    </style>
    <link rel="stylesheet" th:href="@{/css/entity-icons.css}">
</head>
<body>
<div class="container topics-page mt-2">
    <div th:replace="~{fragments/fragnavigation :: fragnavigation}"></div>
</div>
<main class="container topics-page my-3">
    <header class="bg-body border rounded p-3 mb-3">
        <h1 class="h3 mb-3">Topics</h1>
        <form method="get" th:action="@{/topics}" th:attr="hx-get=@{/topics}"
              hx-trigger="submit, input changed delay:350ms from:#topic-query, change from:#topic-category, change from:#topic-sort"
              hx-target="#topic-results" hx-swap="outerHTML" hx-sync="this:replace">
            <div class="row g-2">
                <div class="col-12 col-lg-5">
                    <label for="topic-query" class="form-label mb-1">Topic name</label>
                    <input id="topic-query" name="q" type="search" class="form-control"
                           th:value="${criteria.q}" autocomplete="off" maxlength="160"
                           aria-describedby="topic-query-help">
                    <div id="topic-query-help" class="form-text">Letters can have gaps, in the same order. Try “tmg” for “Tomato Garden”.</div>
                </div>
                <div class="col-sm-6 col-lg-4">
                    <label for="topic-category" class="form-label mb-1">Category</label>
                    <select id="topic-category" name="categoryId" class="form-select">
                        <option value="-1" th:selected="${selectedCategoryId == -1}">All categories</option>
                        <option th:if="${categoryOutsideProfile == true}" th:value="${selectedCategoryId}" selected>
                            Outside active profile
                        </option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                                th:selected="${cat.id == selectedCategoryId}"></option>
                    </select>
                </div>
                <div class="col-sm-6 col-lg-3">
                    <label for="topic-sort" class="form-label mb-1">Sort by</label>
                    <select id="topic-sort" name="sort" class="form-select">
                        <option th:each="option : ${sortOptions}" th:value="${option.name()}" th:text="${option.label}"
                                th:selected="${option == criteria.sort}"></option>
                    </select>
                </div>
            </div>

            <details class="my-3" th:open="${criteria.advanced()}">
                <summary>Advanced search</summary>
                <div class="row g-2 mt-1">
                    <div class="col-sm-6 col-lg-4">
                        <label for="topic-id" class="form-label mb-1">Topic ID</label>
                        <input id="topic-id" type="number" name="id" class="form-control" min="1" th:value="${criteria.id}">
                    </div>
                    <div class="col-sm-6 col-lg-4">
                        <label for="topic-description" class="form-label mb-1">Description contains</label>
                        <input id="topic-description" name="description" class="form-control" th:value="${criteria.description}">
                    </div>
                    <div class="col-sm-6 col-lg-4">
                        <label for="topic-pinned" class="form-label mb-1">Pinned</label>
                        <select id="topic-pinned" name="pinned" class="form-select">
                            <option value="" th:selected="${criteria.pinned == null}">Any</option>
                            <option value="true" th:selected="${criteria.pinned == true}">Pinned</option>
                            <option value="false" th:selected="${criteria.pinned == false}">Not pinned</option>
                        </select>
                    </div>
                    <div class="col-sm-6 col-lg-4">
                        <label for="topic-weight" class="form-label mb-1">Weight</label>
                        <input id="topic-weight" name="weight" type="number" class="form-control" th:value="${criteria.weight}">
                    </div>
                    <div class="col-sm-6 col-lg-4">
                        <label for="topic-prediction-days" class="form-label mb-1">Prediction days</label>
                        <input id="topic-prediction-days" name="predictionDays" type="number" class="form-control"
                               min="0" th:value="${criteria.predictionDays}">
                    </div>
                    <div class="col-sm-6 col-lg-4">
                        <label for="topic-interval-rule" class="form-label mb-1">Interval rule contains</label>
                        <input id="topic-interval-rule" name="intervalRule" class="form-control" th:value="${criteria.intervalRule}">
                    </div>
                    <div class="col-sm-6 col-lg-4">
                        <label for="topic-parser" class="form-label mb-1">Parser contains</label>
                        <input id="topic-parser" name="parser" class="form-control" th:value="${criteria.parser}">
                    </div>
                    <div class="col-sm-6 col-lg-4">
                        <label for="topic-image" class="form-label mb-1">Image filename contains</label>
                        <input id="topic-image" name="image" class="form-control" th:value="${criteria.image}">
                    </div>
                    <div class="col-sm-6 col-lg-4">
                        <label for="topic-base-date" class="form-label mb-1">Base date</label>
                        <input id="topic-base-date" name="baseDate" type="date" class="form-control"
                               min="0001-01-01" max="9999-12-31" th:value="${criteria.baseDate}">
                    </div>
                    <div class="col-sm-6 col-lg-4">
                        <label for="topic-end-date" class="form-label mb-1">End date</label>
                        <input id="topic-end-date" name="endDate" type="date" class="form-control"
                               min="0001-01-01" max="9999-12-31" th:value="${criteria.endDate}">
                    </div>
                </div>
            </details>
            <div class="d-flex flex-wrap gap-2 align-items-center">
                <button type="submit" class="btn btn-primary">Search</button>
                <a class="btn btn-outline-secondary" th:href="@{/topics}">Reset</a>
                <a class="btn btn-outline-secondary" th:href="@{/file-manager}">Image manager</a>
            </div>
        </form>
    </header>

    <section id="topic-results" th:fragment="results" aria-label="Topic results" class="bg-body border rounded p-3">
        <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
        <div th:replace="~{fragments/active-category-profile :: indicator}"></div>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
            <p class="text-body-secondary mb-0" role="status" th:if="${topicsPage.hasContent()}"
               th:text="|${topicsPage.pageable.offset + 1}–${topicsPage.pageable.offset + topicsPage.numberOfElements} of ${topicsPage.totalElements} topics|"></p>
            <a th:unless="${categories.isEmpty() or categoryOutsideProfile == true}" class="btn btn-sm btn-outline-primary"
               th:href="@{/topics/create(categoryId=${selectedCategoryId != -1 ? selectedCategoryId : null},
                                        listReturn=${listReturn})}">New topic</a>
        </div>
        <nav th:fragment="topicPagination" th:if="${topicsPage.totalPages > 1}" aria-label="Topic pages"
             class="d-flex flex-wrap gap-2 align-items-center my-2">
            <a th:if="${previousPath != null}" class="btn btn-sm btn-outline-secondary" rel="prev"
               th:href="@{${previousPath}}">Previous</a>
            <span class="small" th:text="|Page ${topicsPage.number + 1} of ${topicsPage.totalPages}|"></span>
            <a th:if="${nextPath != null}" class="btn btn-sm btn-outline-secondary" rel="next"
               th:href="@{${nextPath}}">Next</a>
        </nav>
        <p th:unless="${topicsPage.hasContent()}" class="mb-0" role="status"
           th:text="${categoryOutsideProfile == true ? 'This category is outside the active profile.' :
                   (categories.isEmpty() and activeCategoryProfileName != null ? 'No categories in the active profile.' :
                   (categories.isEmpty() ? 'Create a category before adding topics.' : 'No topics match these filters.'))}"></p>
        <ul th:if="${topicsPage.hasContent()}" class="list-group list-group-flush">
            <li th:each="topic : ${topicsPage.content}" th:id="'topic-' + ${topic.id}"
                class="topic-row list-group-item px-2 py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div class="topic-identity">
                    <a class="topic-title fw-semibold"
                       th:href="@{/topics/{id}(id=${topic.id},listCategoryId=${selectedCategoryId},listReturn=${listReturn})}"><i th:replace="~{fragments/entity-icons :: icon(${topic.iconKey})}"></i><span th:text="${topic.name}">Topic</span></a>
                    <div class="small text-body-secondary">
                        <span th:text="${topic.categoryName}"></span>
                        <span th:text="| · #${topic.id}|"></span>
                        <span th:if="${topic.pinned}"> · Pinned</span>
                        <span th:if="${topic.weight != 0}" th:text="| · Weight ${topic.weight}|"></span>
                    </div>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/entries/new(topicId=${topic.id},returnPage='topicList',listCategoryId=${selectedCategoryId},
                                              listReturn=${listReturn})}">Add entry</a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/entries(topicId=${topic.id})}">Entries</a>
                    <button type="button" class="btn btn-sm btn-outline-secondary"
                            th:attr="hx-get=@{/topics/info/{id}(id=${topic.id})}"
                            hx-target="#topicInfoContent" hx-sync="#topicInfoContent:replace"
                            data-bs-toggle="modal" data-bs-target="#topicInfoModal">Overview</button>
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/entries/weekly-calendar(topicId=${topic.id})}"
                       th:attr="hx-get=@{/entries/weekly-calendar(topicId=${topic.id},fragment='true')}"
                       hx-target="#topic-calendar-content" hx-sync="#topic-calendar-content:replace"
                       data-bs-toggle="modal" data-bs-target="#topic-calendar">Calendar</a>
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/topics/edit/{id}(id=${topic.id},listReturn=${listReturn})}">Edit</a>
                    <form method="post" th:action="@{/topics/delete/{id}(id=${topic.id})}"
                          onsubmit="return confirm('Delete this topic?')">
                        <input type="hidden" name="listReturn" th:value="${listReturn}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </div>
            </li>
        </ul>
        <div th:replace="~{::topicPagination}"></div>
    </section>
</main>



<div class="modal fade" id="topic-calendar" tabindex="-1" aria-labelledby="topic-calendar-title" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="topic-calendar-title" class="modal-title h5">Weekly calendar</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div id="topic-calendar-content" class="modal-body">Loading calendar…</div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/topicInfoModal :: topicInfoModal}"></div>
<script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
<script th:src="@{/webjars/chart.js/4.5.0/dist/chart.umd.js}"></script>
<script th:src="@{/js/chartjs-plugin-annotation.js}"></script>
<script th:src="@{/js/chartjs-adapter-date-fns.bundle.min.js}"></script>
<script th:src="@{/js/topic-list.js}"></script>
</body>
</html>
