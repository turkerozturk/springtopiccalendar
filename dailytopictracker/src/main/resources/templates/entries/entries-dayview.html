<script>
    function convertDateToMillis(dateStr) {

        // dateStr = "2026-04-06"

        const parts = dateStr.split("-");
        const year = parseInt(parts[0]);
        const month = parseInt(parts[1]) - 1; // JS month 0-based
        const day = parseInt(parts[2]);

        // Local midnight oluştur
        const localDate = new Date(year, month, day);

        return localDate.getTime();
    }

    function loadCalorieData(dateStr) {

        const millis = convertDateToMillis(dateStr);

        const url = `/food?dateMillisYmd=${millis}`;

        // Sayfayı redirect ederek yenile
        window.location.href = url;
    }

    function convertMillisToDateStr(millis) {

        const date = new Date(millis);

        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');

        return `${year}-${month}-${day}`;
    }

    function redirectToNewEntry(topicId) {

        let dateStr;

        if (DATE_MILLIS) {
            dateStr = convertMillisToDateStr(DATE_MILLIS);
        } else {
            dateStr = new Date().toISOString().slice(0, 10);
        }

        const url = `/entries/new?topicId=${topicId}&dateYmd=${dateStr}&returnPage=dayviewtracker`;

        window.open(url, '_self'); // yeni sekme
    }

    $(function () {


        let initialDateStr;

        if (DATE_MILLIS) {
            initialDateStr = convertMillisToDateStr(DATE_MILLIS);
        } else {
            initialDateStr = new Date().toISOString().slice(0, 10);
        }

        $('#calorieDatePicker').val(initialDateStr); // 👉 .val() sadece input, textarea, select için çalışır


        const dateObj = new Date(initialDateStr + 'T00:00:00');
        // https://www.w3schools.com/jsref/jsref_tolocaledatestring.asp
        const dayName = dateObj.toLocaleDateString(appLocale, { weekday: 'short', month: 'short' }); // long, short, narrow yazilis
        $('#caloriesTableDateCell').text(`${initialDateStr} ${dayName}`);



        $('#calorieDateContainer .calorieDateStyle.date').datepicker({
            format: "yyyy-mm-dd",
            todayBtn: "linked",
            autoclose: true,
            todayHighlight: true
        }).on("changeDate", function (e) {
            loadCalorieData(e.format(0, "yyyy-mm-dd"));
        });


        // topic arama kodu

        const $input = $('#foodSearchInput');
        const $results = $('#foodSearchResults');


        // Kullanici yazarken her tusta API cagrisi yapmamak icin bekleme koyar.
        // bu debounce olmasa da filtreleme calisiyordu.
        // debounce ile:
        // kullanici yazmayi birakinca (ornegin 300ms sonra) cagri yapilir.
        let debounceTimer;

        $input.on('input', function () {

            clearTimeout(debounceTimer);

            const query = $(this).val();

            if (query.length < 2) {
                $results.empty();
                return;
            }

            debounceTimer = setTimeout(() => {
                if (query.length >= 2) {
                    //const csrfToken = $('meta[name="_csrf"]').attr('content');
                    //const csrfHeader = $('meta[name="_csrf_header"]').attr('content');

                    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
                    const csrfToken = document.querySelector('meta[name="_csrf"]').content;


                    $.ajax({
                        url: '/api/dayview-topics',
                        data: { q: query },
                        beforeSend: function (xhr) {
                                xhr.setRequestHeader(csrfHeader, csrfToken);
                        },
                        success: function (data) {

                            currentResults = data;
                            selectedIndex = -1;

                            $results.empty();

                            if (data.length === 0) {
                                $results.append('<li class="list-group-item">Sonuç bulunamadı</li>');
                            }

                            data.forEach((item, index) => {

                                const highlighted = highlightMatch(item.name, query);

                                const li = $(`
                                    <li class="list-group-item list-group-item-action" style="cursor:pointer;">
                                        ${highlighted}
                                    </li>
                                `);

                                li.on('click', function () {
                                    redirectToNewEntry(item.id);
                                });

                                $results.append(li);
                            });


                        }
                    });


                }
            }, 300);


        });



    // ⬇️⬆️ ENTER ESC kontrolü
    $input.on('keydown', function (e) {

        const items = $results.find('li');

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
            updateSelection(items);
        }

        if (e.key === 'ArrowUp') {
            e.preventDefault();
            selectedIndex = Math.max(selectedIndex - 1, 0);
            updateSelection(items);
        }

        if (e.key === 'Enter') {
            e.preventDefault();
            if (selectedIndex >= 0 && currentResults[selectedIndex]) {
                redirectToNewEntry(currentResults[selectedIndex].id);
            }
        }

        if (e.key === 'Escape') {
            $results.empty();
            selectedIndex = -1;
        }
    });

    // dışarı tıklama
    $(document).on('click', function (e) {
        if (!$(e.target).closest('#foodSearchInput, #foodSearchResults').length) {
            $results.empty();
            selectedIndex = -1;
        }
    });


});

function updateSelection(items) {
    items.removeClass('active');

    if (selectedIndex >= 0) {
        const $selected = $(items[selectedIndex]);
        $selected.addClass('active');

        // 👇 kritik kisim
        const container = $('#foodSearchResults');

        const itemTop = $selected.position().top;
        const itemBottom = itemTop + $selected.outerHeight();

        const containerScrollTop = container.scrollTop();
        const containerHeight = container.height();

        if (itemBottom > containerHeight) {
            container.scrollTop(containerScrollTop + (itemBottom - containerHeight));
        } else if (itemTop < 0) {
            container.scrollTop(containerScrollTop + itemTop);
        }
    }
}

// asagidaki kodlar arama kutusuna yazilan harflerin sonuclar icerisinde vurgulu gosterilmeleri icin.
const appLocale = /*[[${appLocale}]]*/ 'en';
//const collator = new Intl.Collator(appLocale, { sensitivity: 'base' });

function normalizeText(str) {
    return str
        .toLocaleLowerCase(appLocale)
        .normalize("NFD")                 // karakterleri parçala
        .replace(/\p{Diacritic}/gu, "");  // aksanları sil
}
function highlightMatch(text, query) {

    const normText = normalizeText(text);
    const normQuery = normalizeText(query);

    const index = normText.indexOf(normQuery);

    if (index === -1) return text;

    const end = index + normQuery.length;

    return text.substring(0, index)
        + "<strong style=\"background-color: LightPink; color: gray;\">" + text.substring(index, end) + "</strong>"
        + text.substring(end);
}

</script>

<script>
    $(document).ready(function () {

    let table = new DataTable('#caloriesTable');

    // Custom filter
    $.fn.dataTable.ext.search.push(function (settings, data, dataIndex) {

            let row = table.row(dataIndex).node();

            let selectedStatuses = $('.status-filter:checked')
                .map(function () { return $(this).val(); })
                .get();

            // satırın class'ından status yakala
            let rowStatus = null;
            for (let i = 0; i <= 2; i++) {
                if ($(row).hasClass('status-hide-' + i)) {
                    rowStatus = i.toString();
                    break;
                }
            }

            // seçili değilse gösterme
            return selectedStatuses.includes(rowStatus);
        });

        // checkbox değişince tabloyu yeniden filtrele
        $('.status-filter').on('change', function () {
            table.draw();
        });

    });

</script>

`;

        const rows = meal.querySelectorAll(".food-list-table tbody tr");

        rows.forEach(r => {

            const cols = r.querySelectorAll("td");

            if (cols.length !== 2)
                return;

            const food = cols[0].innerText.trim();
            const gram = cols[1].innerText
                .replace("gr", "")
                .trim();

            text += food + " " + gram + " gr\n";

        });

        document.getElementById("foodTopicText").value = text;

        try {
            await navigator.clipboard.writeText(text);
        } catch(e){
            console.log(e);
        }

        new bootstrap.Modal(
            document.getElementById("foodTopicModal")
        ).show();

    });

});

<script>
  let radarChart;

  function loadRadarChart(date) {
      $.getJSON("/api/dayview-radar", {date: date}, function (data) {
          const ctx = document.getElementById('radarChart').getContext('2d');

          if (radarChart) {
              radarChart.destroy();
          }

          radarChart = new Chart(ctx, {
              type: 'radar',
              data: {
                  labels: data.categoryLabels,
                  datasets: [
                      {
                          data: data.categoryCounts,
                          fill: true,
                          backgroundColor: 'rgba(54, 162, 235, 0.2)',
                          borderColor: 'rgba(54, 162, 235, 1)',
                          pointBackgroundColor: 'rgba(54, 162, 235, 1)'
                      },
                      {
                          data: data.categoryWeights,
                          fill: true,
                          backgroundColor: 'rgba(0, 102, 0, 0.2)',
                          borderColor: 'rgba(0, 102, 0, 1)',
                          pointBackgroundColor: 'rgba(0, 102, 0, 1)'
                      }
                  ]
              },
              options: {
                  responsive: true,
                  scales: {
                      r: {
                          beginAtZero: true,
                          pointLabels: {display: true},
                          ticks: {stepSize: 1, precision: 0}
                      }
                  },
                  plugins: {legend: {display: false}}
              }
          });

          $("#chartInfo").html(
              "You collected <b style='color:darkgreen'>" + data.totalWeight + " / " + [[${dailyGoalScore}]] + "</b> points."
              + "<br><span style='color: dodgerblue;'> Entries: <b>" + data.categoryTotalCount + "</b></span>"
              + " | Categories: " + data.categoryTotalCategories
              + "<br>"
              + "<h5>Scoring Details</h5>"
              + data.reportForPositiveWeight
              + "<hr>"
              + "<h5>Unscored</h5>"
              + data.reportForZeroWeight
              + "<hr>"
              + "<h5>Those excluded from the scoring</h5>"
              + data.reportForNegativeWeight
          );

         // Asagidaki htmx satiri cok onemli, html kodunu backendde urettigimiz icin, ajax ile gelen hx-get calismaz.
         // Ajax ile gelen HTML (report string’leri) → htmx.process(...) ile yeniden isleniyor ve calisiyor.
         // bu satir konuyu tekrar ele alarak hx-get in calismasini saglar(chatgpt aciklamasi notlarda var):
         htmx.process(document.getElementById("chartInfo"));
      });
  }

  // sayfa ilk açıldığında bugünün tarihi ile yükle
  $(function () {
      const today = new Date().toISOString().slice(0, 10);
      loadRadarChart(today);

      $('#chartDateContainer .chartDateStyle.date').datepicker({
          format: "yyyy-mm-dd",
          todayBtn: "linked",
          daysOfWeekHighlighted: "0,6",
          autoclose: true,
          todayHighlight: true
      }).on("changeDate", function (e) {
          loadRadarChart(e.format(0, "yyyy-mm-dd"));
      });
  });
</script>
