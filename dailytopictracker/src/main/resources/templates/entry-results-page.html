<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${scopeName == null ? 'Blog view' : scopeName + ' | Blog view'}">Blog view</title>
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/favicon-180x180.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/manifest.json}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/result-pages.css}">
    <style th:inline="css">body { background-color: /*[[${htmlBackgroundColor}]]*/ #f4f5f7; }</style>
</head>
<body>
<div class="container result-page mt-2">
    <div th:replace="~{fragments/fragnavigation :: fragnavigation}"></div>
</div>
<main class="container result-page my-3">
    <header class="bg-body border rounded p-3 mb-3">
        <h1 class="h3 mb-2">Blog view</h1>
        <p th:if="${scopeName != null}" class="text-body-secondary mb-3" th:text="${scopeName}"></p>
        <nav aria-label="Blog views" class="d-flex flex-wrap gap-2">
            <a th:if="${topic != null}" class="btn btn-primary"
               th:href="@{/entries/new(topicId=${topic.id},categoryId=${topic.category.id},returnPage='entryBrowse',
                                      browseReturn=${resultReturnPath})}">New entry</a>
            <a class="btn btn-outline-secondary" th:href="@{/entries(topicId=${topic?.id})}">Entries list</a>
            <a class="btn btn-outline-secondary" th:href="@{/search}">Search notes</a>
            <a th:if="${topic != null}" class="btn btn-outline-secondary"
               th:href="@{/topics/{id}(id=${topic.id})}">Topic details</a>
            <a th:if="${topic != null}" class="btn btn-outline-secondary"
               th:href="@{/entry-filter/form(categoryId=${topic.category.id})}">Category tracker</a>
            <a th:if="${scopeName != null}" class="btn btn-outline-secondary"
               th:href="@{/entry-results/page}">All entries in blog view</a>
        </nav>
    </header>
    <div th:replace="~{fragments/entry-results :: results}"></div>
</main>
<script th:src="@{/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
