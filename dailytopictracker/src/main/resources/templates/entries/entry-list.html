<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${topic == null ? 'Entries' : topic.name + ' | Entries'}">Entries</title>
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/favicon-180x180.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/manifest.json}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}">
    <style th:inline="css">
        body { background-color: /*[[${htmlBackgroundColor}]]*/ #f4f5f7; }
        .entries-page { max-width: 64rem; overflow-wrap: anywhere; }
        .entry-row { scroll-margin-top: 1rem; }
        .entry-row:target { box-shadow: inset .25rem 0 var(--bs-primary); background: var(--bs-primary-bg-subtle); }
        .entry-content { min-width: 0; }
        .entry-note img, .entries-page img { max-width: 100%; height: auto; }
        .entry-note pre, .entries-page pre { white-space: pre-wrap; }
        .entry-note { overflow-wrap: anywhere; }
        .page-control { max-width: 7rem; }
    </style>
</head>
<body>
<div class="container entries-page mt-2">
    <div th:replace="~{fragments/fragnavigation :: fragnavigation}"></div>
</div>

<main class="container entries-page my-3">
    <header class="bg-body border rounded p-3 mb-3">
        <h1 class="h3 mb-2" th:text="${topic == null ? 'Entries' : topic.name + ' · Entries'}">Entries</h1>
        <div th:if="${topic != null}" class="mb-3">
            <div class="mb-2" style="white-space: pre-line;" th:if="${!topicDescriptionAsHtml.isEmpty()}"
                 th:utext="${topicDescriptionAsHtml}"></div>
            <nav class="d-flex flex-wrap gap-3" aria-label="Topic views">
                <a th:href="@{/entries(size=${entriesPage.size})}">All topics</a>
                <a th:href="@{/topics/{id}(id=${topic.id})}">Topic details</a>
                <a th:href="@{/entries/weekly-calendar(topicId=${topic.id})}">Weekly calendar</a>
                <a th:href="@{/entry-filter/form(categoryId=${topic.category.id})}">Category tracker</a>
            </nav>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <a th:if="${hasTopics}" class="btn btn-primary"
               th:href="@{/entries/new(topicId=${topicId},returnPage='entryList',
                                      listTopicId=${topicId},listPage=${entriesPage.number},listSize=${entriesPage.size})}">New entry</a>
            <a class="btn btn-outline-secondary" th:href="@{/entry-results/page(topicId=${topicId})}">Blog view</a>
            <a class="btn btn-outline-secondary" th:href="@{/search}">Search notes</a>
        </div>
    </header>

    <section aria-label="Entry list" class="bg-body border rounded p-3">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
            <p class="text-body-secondary mb-0" th:if="${entriesPage.hasContent()}"
               th:text="|${entriesPage.pageable.offset + 1}–${entriesPage.pageable.offset + entriesPage.numberOfElements} of ${entriesPage.totalElements} entries|"></p>
            <div th:replace="~{entries/entry-pagination :: controls(${entriesPage},${topicId})}"></div>
        </div>
        <details th:if="${entriesPage.hasContent()}" class="mb-3">
            <summary>Page options</summary>
            <form class="d-flex flex-wrap gap-2 align-items-end mt-2" th:action="@{/entries}" method="get">
                <input th:if="${topicId != null}" type="hidden" name="topicId" th:value="${topicId}">
                <div>
                    <label for="entry-page" class="form-label mb-0">Page number</label>
                    <input id="entry-page" class="form-control page-control" type="number" name="pageNumber"
                           min="1" th:value="${entriesPage.number + 1}">
                </div>
                <div>
                    <label for="entry-size" class="form-label mb-0">Entries per page</label>
                    <input id="entry-size" class="form-control page-control" type="number" name="size"
                           min="1" max="200" th:value="${entriesPage.size}" required>
                </div>
                <button type="submit" class="btn btn-outline-secondary">Go</button>
            </form>
        </details>

        <p th:unless="${entriesPage.hasContent()}" class="mb-0">No entries yet.</p>
        <ul th:if="${entriesPage.hasContent()}" class="list-group list-group-flush">
            <li th:each="entry : ${entriesPage.content}" th:id="'entry-' + ${entry.id}"
                class="entry-row list-group-item px-2 py-3 d-flex flex-wrap justify-content-between align-items-start gap-2"
                th:with="hasNote=${entry.note != null and entry.note.content != null and !entry.note.content.isBlank()}">
                <div class="entry-content flex-grow-1">
                    <div class="d-flex flex-wrap align-items-baseline gap-2">
                        <a class="fw-semibold"
                           th:href="@{/topics/{id}(id=${entry.topic.id})}" th:text="${entry.topic.name}">Topic</a>
                        <span class="badge rounded-pill"
                              th:classappend="${entry.status == 1 ? 'text-bg-success' : (entry.status == 2 ? 'text-bg-warning' : 'text-bg-secondary')}"
                              th:text="${entry.status == 1 ? 'Done' : (entry.status == 2 ? 'Warning' : 'Not marked')}"></span>
                    </div>
                    <div class="small text-body-secondary">
                        <time th:if="${entry.date != null}" th:attr="datetime=${entry.date}" th:text="${entry.date}"></time>
                        <span th:unless="${entry.date != null}">No date</span>
                        <span th:if="${entry.topic.category != null}" th:text="| · ${entry.topic.category.name}|"></span>
                    </div>
                    <p class="small mb-0 mt-1" th:if="${hasNote}"
                       th:text="${#strings.abbreviate(entry.note.content.strip(), 145)}"></p>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <a th:if="${topicId == null}" class="btn btn-sm btn-outline-secondary"
                       th:href="@{/entries(topicId=${entry.topic.id},size=${entriesPage.size})}">Topic entries</a>
                    <a class="btn btn-sm btn-outline-secondary entry-edit"
                       th:href="@{/entries/edit/{id}(id=${entry.id},categoryId=${entry.topic.category.id},
                                                      returnPage='entryList',listTopicId=${topicId},
                                                      listPage=${entriesPage.number},listSize=${entriesPage.size})}">Edit</a>
                    <a th:if="${hasNote}" class="btn btn-sm btn-outline-secondary entry-note-link"
                       th:href="@{/entries/{id}/note-full(id=${entry.id})}"
                       th:attr="data-bs-toggle='modal',data-bs-target='#entry-note-modal',
                                data-topic-name=${entry.topic.name},data-entry-date=${entry.date},
                                data-tracker-url=@{/entry-filter/form(categoryId=${entry.topic.category.id})}">Read note</a>
                </div>
            </li>
        </ul>
        <div class="mt-3" th:if="${entriesPage.totalPages > 1}">
            <div th:replace="~{entries/entry-pagination :: controls(${entriesPage},${topicId})}"></div>
        </div>
    </section>
</main>

<div class="modal fade" id="entry-note-modal" tabindex="-1" aria-labelledby="entry-note-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 class="modal-title h5" id="entry-note-title">Entry note</h2>
                    <p class="text-body-secondary small mb-0" id="entry-note-date"></p>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body entry-note" id="entry-note-content" aria-live="polite"></div>
            <div class="modal-footer">
                <span class="me-auto small" id="entry-note-copy-status" role="status"></span>
                <a id="entry-note-tracker" class="btn btn-outline-secondary">Category tracker</a>
                <a id="entry-note-edit" class="btn btn-outline-secondary">Edit</a>
                <button id="entry-note-copy" type="button" class="btn btn-outline-secondary" disabled>Copy note</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/entry-list.js}"></script>
</body>
</html>
