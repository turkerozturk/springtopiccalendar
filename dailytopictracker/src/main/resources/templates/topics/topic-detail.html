<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${topic.name} + ' | Daily Topic Tracker'">Topic | Daily Topic Tracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}">
    <style>
        .topic-detail { max-width: 56rem; overflow-wrap: anywhere; }
        .topic-detail img { max-width: 100%; height: auto; }
        .topic-detail pre { white-space: pre-wrap; }
        .entry-note { white-space: pre-wrap; }
        .entry-summary { cursor: pointer; }
    </style>
</head>
<body>
<div th:replace="~{fragments/fragnavigation :: fragnavigation}"></div>

<main class="container topic-detail py-3 py-md-4">
    <a th:href="@{/topics(categoryId=${listCategoryId})} + '#topic-' + ${topic.id}">← Back to topics</a>

    <header class="mt-3 border-bottom pb-3"
            th:with="fromDate=${entryHistory != null ? historyFilter.fromDate : null},
                     toDate=${entryHistory != null ? historyFilter.toDate : null},
                     historyPage=${entryHistory != null and entryHistory.number > 0 ? entryHistory.number + 1 : null}">
        <p class="text-body-secondary mb-1" th:text="${topic.categoryName}">Category</p>
        <h1 class="h2 mb-2" th:text="${topic.name}">Topic</h1>
        <div class="my-3" th:if="${!descriptionHtml.isEmpty()}" th:utext="${descriptionHtml}"></div>
        <p class="text-body-secondary" th:if="${topic.latestEntryDate() != null}">
            Latest entry <time th:attr="datetime=${topic.latestEntryDate()}" th:text="${topic.latestEntryDate()}"></time>
        </p>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-primary"
               th:href="@{/entries/new(topicId=${topic.id},returnPage='topicDetail',listCategoryId=${listCategoryId},
                                      fromDate=${fromDate},toDate=${toDate},historyPage=${historyPage})}">Add entry</a>
            <a class="btn btn-outline-secondary" th:href="@{/entries(topicId=${topic.id})}">All entries</a>
        </div>
    </header>

    <section class="mt-4" aria-labelledby="topic-entries"
             th:with="shownEntries=${entryHistory != null ? entryHistory.content : topic.recentEntries}">
        <h2 class="h4" id="topic-entries" th:text="${entryHistory != null ? 'Entries in date range' : 'Recent entries'}">
            Recent entries
        </h2>
        <form class="row g-2 align-items-end mb-3" method="get" th:action="@{/topics/{id}(id=${topic.id})}">
            <input type="hidden" name="listCategoryId" th:value="${listCategoryId}">
            <div class="col-sm-auto">
                <label class="form-label mb-1" for="fromDate">From date</label>
                <input class="form-control" type="date" name="fromDate" id="fromDate"
                       min="0001-01-01" max="9999-12-31" th:value="${historyFilter.fromDate}">
            </div>
            <div class="col-sm-auto">
                <label class="form-label mb-1" for="toDate">Through date</label>
                <input class="form-control" type="date" name="toDate" id="toDate"
                       min="0001-01-01" max="9999-12-31" th:value="${historyFilter.toDate}">
            </div>
            <div class="col-sm-auto d-flex gap-2">
                <button class="btn btn-outline-primary" type="submit">Filter by date</button>
                <a class="btn btn-outline-secondary" th:if="${historyFilter.fromDate != null or historyFilter.toDate != null}"
                   th:href="@{/topics/{id}(id=${topic.id},listCategoryId=${listCategoryId})}">Clear dates</a>
            </div>
        </form>
        <p class="alert alert-danger" role="alert" th:if="${historyFilterError != null}"
           th:text="${historyFilterError}"></p>
        <p class="text-body-secondary" th:if="${shownEntries.isEmpty()}"
           th:text="${entryHistory != null ? 'No entries in this date range.' : 'No dated entries yet.'}"></p>
        <ul class="list-group" th:unless="${shownEntries.isEmpty()}">
            <li class="list-group-item" th:each="entry : ${shownEntries}"
                th:with="status=${entry.status == 1 ? 'Done' : (entry.status == 2 ? 'Warning' : 'Not marked')}">
                <details th:if="${entry.note != null and !entry.note.isBlank()}">
                    <summary class="entry-summary">
                        <time th:attr="datetime=${entry.date}" th:text="${entry.date}"></time>
                        <span class="ms-2 text-body-secondary" th:text="${status}"></span>
                    </summary>
                    <div class="entry-note mt-2" th:text="${entry.note}"></div>
                </details>
                <div th:unless="${entry.note != null and !entry.note.isBlank()}">
                    <time th:attr="datetime=${entry.date}" th:text="${entry.date}"></time>
                    <span class="ms-2 text-body-secondary" th:text="${status}"></span>
                </div>
            </li>
        </ul>
        <nav class="d-flex flex-wrap align-items-center gap-2 mt-3" aria-label="Entry history pages"
             th:if="${entryHistory != null and entryHistory.totalPages > 1}">
            <a class="btn btn-outline-secondary" rel="prev" th:if="${entryHistory.hasPrevious()}"
               th:href="@{/topics/{id}(id=${topic.id},listCategoryId=${listCategoryId},fromDate=${historyFilter.fromDate},
                                     toDate=${historyFilter.toDate},historyPage=${entryHistory.number})} + '#topic-entries'">
                Previous
            </a>
            <span th:text="|Page ${entryHistory.number + 1} of ${entryHistory.totalPages}|"></span>
            <a class="btn btn-outline-secondary" rel="next" th:if="${entryHistory.hasNext()}"
               th:href="@{/topics/{id}(id=${topic.id},listCategoryId=${listCategoryId},fromDate=${historyFilter.fromDate},
                                     toDate=${historyFilter.toDate},historyPage=${entryHistory.number + 2})} + '#topic-entries'">
                Next
            </a>
        </nav>
    </section>
</main>
<script th:src="@{/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
