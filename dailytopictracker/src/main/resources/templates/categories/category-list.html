<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Categories</title>
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/favicon-180x180.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/manifest.json}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}">
    <style th:inline="css">
        body { background-color: /*[[${htmlBackgroundColor}]]*/ #f4f5f7; }
        .categories-page { max-width: 62rem; overflow-wrap: anywhere; }
        .category-row { scroll-margin-top: 1rem; }
        .category-row:target { box-shadow: inset .25rem 0 var(--bs-primary); background: var(--bs-primary-bg-subtle); }
        .category-identity { min-width: 0; }
    </style>
</head>
<body>
<div class="container categories-page mt-2">
    <div th:replace="~{fragments/fragnavigation :: fragnavigation}"></div>
</div>
<main class="container categories-page my-3">
    <header class="bg-body border rounded p-3 mb-3">
        <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between mb-3">
            <h1 class="h3 mb-0">Categories</h1>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/category-groups}">Category groups</a>
        </div>
        <form method="get" th:action="@{/categories}" th:attr="hx-get=@{/categories}"
              hx-trigger="submit, input changed delay:350ms from:#category-query, change from:#category-group, change from:#category-status, change from:#category-sort"
              hx-target="#category-results" hx-swap="outerHTML" hx-sync="this:replace">
            <div class="row g-2">
                <div class="col-12 col-lg-4">
                    <label for="category-query" class="form-label mb-1">Category name</label>
                    <input id="category-query" name="q" type="search" class="form-control"
                           th:value="${filter.q}" maxlength="160" autocomplete="off">
                </div>
                <div class="col-sm-6 col-lg-3">
                    <label for="category-group" class="form-label mb-1">Category group</label>
                    <select id="category-group" name="groupId" class="form-select">
                        <option value="">All groups</option>
                        <option th:if="${groupOutsideProfile == true}" th:value="${filter.groupId}" selected>
                            Outside active profile
                        </option>
                        <option th:each="group : ${groups}" th:value="${group.id}" th:text="${group.name}"
                                th:selected="${group.id == filter.groupId}"></option>
                    </select>
                </div>
                <div class="col-sm-6 col-lg-2">
                    <label for="category-status" class="form-label mb-1">Status</label>
                    <select id="category-status" name="archived" class="form-select">
                        <option value="">All statuses</option>
                        <option value="false" th:selected="${filter.archived == false}">Active</option>
                        <option value="true" th:selected="${filter.archived == true}">Archived</option>
                    </select>
                </div>
                <div class="col-sm-6 col-lg-3">
                    <label for="category-sort" class="form-label mb-1">Sort by</label>
                    <select id="category-sort" name="sort" class="form-select">
                        <option th:each="option : ${sortOptions}" th:value="${option.name()}" th:text="${option.label}"
                                th:selected="${option == filter.sort}"></option>
                    </select>
                </div>
            </div>
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-primary">Search</button>
                <a th:href="@{/categories}" class="btn btn-outline-secondary">Reset</a>
            </div>
        </form>
    </header>

    <section id="category-results" th:fragment="results" aria-label="Category results" class="bg-body border rounded p-3">
        <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
        <div th:if="${success != null}" class="alert alert-success" role="status" th:text="${success}"></div>
        <div th:replace="~{fragments/active-category-profile :: indicator}"></div>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
            <p th:if="${categoriesPage.hasContent()}" class="text-body-secondary mb-0" role="status"
               th:text="|${categoriesPage.pageable.offset + 1}–${categoriesPage.pageable.offset + categoriesPage.numberOfElements} of ${categoriesPage.totalElements} categories|"></p>
            <a th:unless="${groups.isEmpty() or groupOutsideProfile == true}" class="btn btn-sm btn-outline-primary"
               th:href="@{/categories/create(categoryGroupId=${filter.groupId},listReturn=${listReturn})}">New category</a>
        </div>
        <nav th:fragment="categoryPagination" th:if="${categoriesPage.totalPages > 1}" aria-label="Category pages"
             class="d-flex flex-wrap gap-2 align-items-center my-2">
            <a th:if="${previousPath != null}" class="btn btn-sm btn-outline-secondary" rel="prev"
               th:href="@{${previousPath}}">Previous</a>
            <span class="small" th:text="|Page ${categoriesPage.number + 1} of ${categoriesPage.totalPages}|"></span>
            <a th:if="${nextPath != null}" class="btn btn-sm btn-outline-secondary" rel="next"
               th:href="@{${nextPath}}">Next</a>
        </nav>
        <p th:unless="${categoriesPage.hasContent()}" class="mb-0" role="status"
           th:text="${groupOutsideProfile == true ? 'This group has no categories in the active profile.' :
                   (groups.isEmpty() and activeCategoryProfileName != null ? 'No categories in the active profile.' :
                   (groups.isEmpty() ? 'Create a category group before adding categories.' :
                   (filter.q.isEmpty() and filter.groupId == null and filter.archived == null
                   ? 'No categories yet.' : 'No categories match these filters.')))}"></p>
        <ul th:if="${categoriesPage.hasContent()}" class="list-group list-group-flush">
            <li th:each="category : ${categoriesPage.content}" th:id="'category-' + ${category.id}"
                class="category-row list-group-item px-2 py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div class="category-identity">
                    <div class="d-flex flex-wrap gap-2 align-items-baseline">
                        <a class="fw-semibold" th:href="@{/topics(categoryId=${category.id})}" th:text="${category.name}">
                            Category
                        </a>
                        <span class="badge rounded-pill"
                              th:classappend="${category.archived ? 'text-bg-secondary' : 'text-bg-light'}"
                              th:text="${category.archived ? 'Archived' : 'Active'}"></span>
                    </div>
                    <div class="small text-body-secondary">
                        <a th:href="@{/categories(groupId=${category.groupId})}" th:text="${category.groupName}"></a>
                        <span th:text="| · ${category.topicCount} ${category.topicCount == 1 ? 'topic' : 'topics'} · #${category.id}|"></span>
                    </div>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/topics/create(categoryId=${category.id},categoryReturn=${listReturn})}">Add topic</a>
                    <a th:unless="${category.archived}" class="btn btn-sm btn-outline-secondary"
                       th:href="@{/entry-filter/form(categoryId=${category.id})}">Tracker</a>
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/entry-results/page(categoryId=${category.id})}">Blog view</a>
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/categories/edit/{id}(id=${category.id},listReturn=${listReturn})}">Edit</a>
                    <form method="post" th:action="@{/categories/delete/{id}(id=${category.id})}"
                          onsubmit="return confirm('Delete this category?')">
                        <input type="hidden" name="listReturn" th:value="${listReturn}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </div>
            </li>
        </ul>
        <div th:replace="~{::categoryPagination}"></div>
    </section>
</main>
<script th:src="@{/webjars/bootstrap/5.3.7/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
</body>
</html>
