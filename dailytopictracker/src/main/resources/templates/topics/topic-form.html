<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${topic.id == null ? 'Create topic' : 'Edit topic'}">Topic</title>
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/favicon-180x180.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/manifest.json}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/easymde/2.18.0/dist/easymde.min.css}">
    <style th:inline="css">
        body { background-color: /*[[${htmlBackgroundColor}]]*/ #f4f5f7; }
        .topic-form-page { max-width: 82rem; }
        .topic-form-header { z-index: 4; }
        .topic-form-card { min-width: 0; }
        .topic-form-card .editor-toolbar:not(.fullscreen) { display: flex; flex-wrap: wrap; }
        .topic-form-card .editor-preview { overflow-wrap: anywhere; }
        .topic-form-card .editor-preview img { max-width: 100%; height: auto; }
        .topic-form-card .editor-preview pre { white-space: pre-wrap; }
        .topic-image-preview { width: 5rem; height: 5rem; object-fit: contain; }
    </style>
    <link rel="stylesheet" th:href="@{/css/entity-icons.css}">
</head>
<body>
<main class="container topic-form-page py-3">
    <form th:object="${topic}" th:action="${topic.id != null} ? @{/topics/update/{id}(id=${topic.id})} : @{/topics}"
          method="post">
        <input th:if="${topic.id != null}" type="hidden" th:field="*{id}">
        <input type="hidden" name="returnPage" th:value="${returnPage}">
        <input th:if="${listReturn != null}" type="hidden" name="listReturn" th:value="${listReturn}">
        <input th:if="${categoryReturn != null}" type="hidden" name="categoryReturn" th:value="${categoryReturn}">
        <input type="hidden" name="dateMillisYmd" th:value="${dateMillisYmd}">

        <header class="topic-form-header sticky-top d-flex justify-content-between align-items-center gap-2 flex-wrap
                       rounded border bg-body p-3 mb-3 shadow-sm">
            <h1 class="h4 mb-0" th:text="${topic.id == null ? 'Create topic' : 'Edit topic'}">Edit topic</h1>
            <div class="d-flex gap-2">
                <th:block th:switch="${topicListPath != null ? 'listReturn' : returnPage}">
                    <a th:case="'listReturn'" class="btn btn-outline-secondary" th:href="@{${topicListPath}}">Cancel</a>
                    <a th:case="'pivottable'" class="btn btn-outline-secondary" th:href="@{/entry-filter/return}">Cancel</a>
                    <a th:case="'topics'" class="btn btn-outline-secondary" th:href="@{/entry-filter/return}">Cancel</a>
                    <a th:case="'reporttable'" class="btn btn-outline-secondary" th:href="@{/reports/all}">Cancel</a>
                    <a th:case="'entries'" class="btn btn-outline-secondary" th:href="@{/entries(topicId=${topic.id})}">Cancel</a>
                    <a th:case="'home'" class="btn btn-outline-secondary" th:href="@{/}">Cancel</a>
                    <a th:case="'index'" class="btn btn-outline-secondary" th:href="@{/}">Cancel</a>
                    <a th:case="'calorietracker'" class="btn btn-outline-secondary"
                       th:href="@{/food(dateMillisYmd=${dateMillisYmd})}">Cancel</a>
                    <a th:case="'dayviewtracker'" class="btn btn-outline-secondary"
                       th:href="@{/dayview(dateMillisYmd=${dateMillisYmd})}">Cancel</a>
                    <a th:case="*" class="btn btn-outline-secondary" th:href="@{/topics(categoryId=${topic.category?.id})}">Cancel</a>
                </th:block>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </header>

        <div class="row g-3">
            <div class="col-lg-7 col-xl-8">
                <section class="topic-form-card rounded border bg-body p-3" aria-label="Topic and description">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Topic name</label>
                            <input type="text" th:field="*{name}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label for="category" class="form-label">Category</label>
                            <select id="category" th:field="*{category.id}" class="form-select" required>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                            <label for="categoryFilter" class="visually-hidden">Filter categories</label>
                            <input type="search" id="categoryFilter" class="form-control form-control-sm mt-2"
                                   placeholder="Filter categories" autocomplete="off">
                        </div>
                    </div>
                    <div th:replace="~{fragments/entity-icons :: picker(${topic.iconKey})}"></div>
                    <div class="mb-3">
                        <label for="tagLines" class="form-label">Tags</label>
                        <textarea id="tagLines" name="tagLines" class="form-control" rows="2"
                                  aria-describedby="topic-tags-help" th:text="${tagLines}"></textarea>
                        <div id="topic-tags-help" class="form-text"
                             th:text="${topic.id == null ? 'One extra tag per line. The selected category is added automatically.' : 'One tag per line. Spaces within a tag are allowed.'}"></div>
                    </div>
                    <label for="description" class="form-label">Description (Markdown)</label>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="12"></textarea>
                </section>
            </div>

            <div class="col-lg-5 col-xl-4 d-flex flex-column gap-3">
                <section class="topic-form-card rounded border bg-body p-3" aria-labelledby="topic-schedule">
                    <h2 class="h6 mb-3" id="topic-schedule">Schedule</h2>
                    <div class="row g-2 mb-3">
                        <div class="col-sm">
                            <label for="someTimeLater" class="form-label">Prediction days</label>
                            <input type="number" th:field="*{someTimeLater}" class="form-control" min="0"
                                   aria-describedby="prediction-days-help">
                            <div class="form-text" id="prediction-days-help">Blank or 0 disables prediction.</div>
                        </div>
                        <div class="col-sm">
                            <label for="intervalRule" class="form-label">Interval rule</label>
                            <input type="text" th:field="*{intervalRule}" class="form-control">
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col-sm">
                            <input type="hidden" th:field="*{baseDateMillisYmd}">
                            <label for="baseDatePicker" class="form-label">Base date</label>
                            <input type="date" id="baseDatePicker" class="form-control"
                                   th:value="${topic.baseDateMillisYmd == null ? null :
                                     T(java.time.Instant).ofEpochMilli(topic.baseDateMillisYmd).atZone(T(java.time.ZoneId).systemDefault()).toLocalDate()}">
                            <div class="d-flex flex-wrap gap-2 mt-2">
                                <button type="button" class="btn btn-sm btn-outline-secondary" data-clear-date="base">Clear</button>
                                <button th:if="${firstDoneEntryDateMillisYmd != null}" type="button"
                                        class="btn btn-sm btn-outline-secondary" data-use-date="base"
                                        th:attr="data-date-millis=${firstDoneEntryDateMillisYmd}">Use first done date</button>
                            </div>
                        </div>
                        <div class="col-sm">
                            <input type="hidden" th:field="*{endDateMillisYmd}">
                            <label for="endDatePicker" class="form-label">End date</label>
                            <input type="date" id="endDatePicker" class="form-control"
                                   th:value="${topic.endDateMillisYmd == null ? null :
                                     T(java.time.Instant).ofEpochMilli(topic.endDateMillisYmd).atZone(T(java.time.ZoneId).systemDefault()).toLocalDate()}">
                            <div class="d-flex flex-wrap gap-2 mt-2">
                                <button type="button" class="btn btn-sm btn-outline-secondary" data-clear-date="end">Clear</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary" data-use-date="end"
                                        th:attr="data-date-millis=${todayMillisYmd}">Use today</button>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="topic-form-card rounded border bg-body p-3" aria-labelledby="topic-options">
                    <h2 class="h6 mb-3" id="topic-options">Topic options</h2>
                    <div class="row g-2 align-items-end mb-3">
                        <div class="col-sm">
                            <label for="weight" class="form-label">Weight</label>
                            <input type="number" th:field="*{weight}" class="form-control" min="-1"
                                   aria-describedby="weight-help">
                        </div>
                        <div class="col-sm">
                            <div class="form-check form-switch py-1">
                                <input type="checkbox" id="pinned" th:field="*{pinned}" class="form-check-input">
                                <label for="pinned" class="form-check-label">Pinned</label>
                            </div>
                        </div>
                    </div>
                    <div class="form-text mt-n2 mb-3" id="weight-help">Default is 0. Use −1 for low priority.</div>
                    <label for="dataClassName" class="form-label">Parser</label>
                    <select th:field="*{dataClassName}" class="form-select">
                        <option value="">Without parser</option>
                        <option th:if="${!#strings.isEmpty(topic.dataClassName) and !availableParsers.contains(topic.dataClassName)}"
                                th:value="${topic.dataClassName}" th:text="${topic.dataClassName + ' (saved)'}"></option>
                        <option th:each="parserName : ${availableParsers}" th:value="${parserName}" th:text="${parserName}"></option>
                    </select>
                </section>

                <section th:if="${imageFilePaths != null}" class="topic-form-card rounded border bg-body p-3"
                         aria-labelledby="topic-image">
                    <h2 class="h6 mb-3" id="topic-image">Image</h2>
                    <div class="d-flex gap-2 align-items-start">
                        <div class="flex-grow-1 topic-form-card">
                            <label for="imageFileName" class="visually-hidden">Image file</label>
                            <select th:field="*{imageFileName}" class="form-select">
                                <option value="">No image</option>
                                <option th:if="${!#strings.isEmpty(topic.imageFileName) and !imageFilePaths.contains(topic.imageFileName)}"
                                        th:value="${topic.imageFileName}" th:text="${topic.imageFileName + ' (saved)'}"
                                        th:attr="data-preview-url=@{${topic.imageFileName}}"></option>
                                <option th:each="path : ${imageFilePaths}" th:value="${path}" th:text="${path}"
                                        th:attr="data-preview-url=@{${path}}"></option>
                            </select>
                            <label for="imageFilter" class="visually-hidden">Filter images</label>
                            <input id="imageFilter" type="search" class="form-control form-control-sm mt-2"
                                   placeholder="Filter images" autocomplete="off">
                        </div>
                        <img id="imagePreview" class="topic-image-preview rounded border" alt="Image preview"
                             th:src="${#strings.isEmpty(topic.imageFileName)} ? @{/images/default.png} : @{${topic.imageFileName}}"
                             th:attr="data-default-url=@{/images/default.png}">
                    </div>
                </section>
            </div>
        </div>
    </form>
</main>
<script th:src="@{/webjars/easymde/2.18.0/dist/easymde.min.js}"></script>
<script th:src="@{/js/topic-form.js}"></script>
</body>
</html>
