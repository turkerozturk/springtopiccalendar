<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!--
    This file is part of the DailyTopicTracker project.
    Please refer to the project's README.md file for additional details.
    https://github.com/turkerozturk/springtopiccalendar
    -->
    <meta charset="UTF-8"/>
    <title>Entry Form</title>

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/manifest.json">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">

    <link rel="stylesheet" type="text/css" th:href="@{/webjars/font-awesome/css/all.min.css}">

    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap-datepicker/dist/css/bootstrap-datepicker.css}">

    <link rel="stylesheet" type="text/css" href="/webjars/easymde/2.18.0/dist/easymde.min.css">


    <style>
        form {
            background-color: WhiteSmoke;
            border-radius: 15px;
        }
    </style>

</head>


<body>

<div class="container mx-auto mt-4" style="max-width: 400px;">

    <!-- HATA MESAJI GÖSTERME ALANI -->
    <div th:if="${errorMessage != null}" class="text-danger mb-3">
        <p th:text="${errorMessage}"></p>
    </div>

    <a th:if="${topicReturnPath != null}" class="d-inline-block mb-3"
       th:href="@{${topicReturnPath}}">← Back to topic</a>
    <a th:if="${topicEntryForm == true and returnPage == 'topicList'}" class="d-inline-block mb-3"
       th:href="@{/topics(categoryId=${listCategoryId})} + '#topic-' + ${entry.topic.id}">← Back to topics</a>

    <form th:action="@{/entries/save}" th:object="${entry}" method="post"
          th:with="nativeEntryDate=${topicEntryForm == true or entryListReturnPath != null}"
          th:classappend="${nativeEntryDate ? 'px-3 py-2' : ''}">
        <fieldset>

            <legend th:text="${#strings.isEmpty(entry.id) ? 'Add New Entry' : 'Update Entry (id: ' + entry.id + ')'}"></legend>


        <!-- Kaynak URL'deki parametreyle gelen categoryId'yi burada saklıyoruz -->
        <!-- <input type="hidden" name="origCategoryId" th:value="${categoryId}"/> -->

        <!-- kaydolunca geri donecegi sayfayi belirten bir placeholer string. bkz. save metodu.(gizli alan) -->
        <input type="hidden" name="returnPage" th:value="${returnPage}">
        <th:block th:if="${entryListReturnPath != null}" th:insert="~{::entryListFields}"></th:block>
        <input th:if="${topicEntryForm}" type="hidden" name="listCategoryId" th:value="${listCategoryId}">
        <th:block th:if="${topicReturnPath != null}">
            <input th:if="${historyFilter.fromDate != null}" type="hidden" name="fromDate" th:value="${historyFilter.fromDate}">
            <input th:if="${historyFilter.toDate != null}" type="hidden" name="toDate" th:value="${historyFilter.toDate}">
            <input th:if="${historyFilter.historyPage != null}" type="hidden" name="historyPage"
                   th:value="${historyFilter.historyPage}">
        </th:block>



       <!--  <input type="hidden" name="categoryGroupId" th:value="${entry.topic.category.categoryGroup.id}" th:if="${entry.topic != null}"> -->

            <input type="hidden" name="categoryGroupId" th:value="${categoryGroupId}" th:if="${topicEntryForm != true and entry.topic != null}">


        <!-- entry ID (gizli alan) -->
        <input type="hidden" th:field="*{id}"/>

        <!-- dateMillisYmd (artık gizli) -->
        <input th:unless="${nativeEntryDate}" type="hidden" id="dateMillisYmd" th:field="*{dateMillisYmd}" />

        <div th:if="${topicEntryForm}" class="mb-3">
            <input type="hidden" th:field="*{topic.id}"/>
            <strong th:text="${entry.topic.name}">Topic</strong>
        </div>

        <th:block th:unless="${topicEntryForm}">
        <!-- (1) KATEGORİ FİLTRE SEÇİMİ -->
        <div class="mb-3 row">
            <label for="categoryFilter" class="col-sm-5 col-form-label col-form-label-sm">Select a Category:</label>
            <div class="col-sm-7">
                <select id="categoryFilter" class="form-select form-select-sm" name="categoryId" onchange="loadTopicsByCategory(this.value)" th:attr="tabindex=${nativeEntryDate ? null : 1}">
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.name}"
                            th:selected="${cat.id} == ${categoryId}"></option>
                </select>
            </div>
        </div>

        <!-- (2) ARAMA METNİ İLE FİLTRE -->
        <div class="mb-3 row">
            <label for="topicSearch" class="col-sm-5 col-form-label col-form-label-sm">Filter Topic:</label>
            <div class="col-sm-7">
                <input type="text" id="topicSearch" class="form-control form-control-sm" oninput="filterTopics()" th:attr="tabindex=${nativeEntryDate ? null : 2}"/>
            </div>
        </div>

        <!-- (3) TOPIC SEÇİM ALANI -->
        <div class="mb-3 row">
            <label for="topicSelect" class="col-sm-4 col-form-label col-form-label-sm">Topic:</label>
            <div class="col-sm-8">
                <select th:field="*{topic.id}" id="topicSelect" class="form-select form-select-sm"
                        th:required="${entryListReturnPath != null}" th:attr="tabindex=${nativeEntryDate ? null : 3}">
                    <option th:each="t : ${topics}"
                            th:value="${t.id}"
                            th:text="${t.name}"
                            th:attr="data-category=${t.category != null ? t.category.name : ''}">
                    </option>
                </select>
            </div>
        </div>

        </th:block>

        <div th:if="${nativeEntryDate}" class="mb-3">
            <label for="topicEntryDate" class="form-label">Date</label>
            <input type="date" id="topicEntryDate" name="topicEntryDate" class="form-control"
                   th:value="${topicEntryDate}" required>
        </div>

        <!-- Alternatif: Date Picker (tıklayarak seçim) -->
        <div th:unless="${nativeEntryDate}" class="row mb-3" id="entryDateContainer">
            <div class="input-group entryDateStyle date">
                <label for="entryDatePicker" class="col-sm-4 col-form-label col-form-label-sm">Select Date:</label>
                <input type="text" id="entryDatePicker"
                       class="form-control form-control-sm"
                       onchange="convertDateToEpoch()"
                       th:value="${
                           entry.dateMillisYmd != null
                             ? T(java.time.Instant).ofEpochMilli(entry.dateMillisYmd)
                                .atZone(T(java.time.ZoneId).systemDefault())
                                .toLocalDate()
                             : ''
                       }"
                       th:attr="tabindex=${nativeEntryDate ? null : 4}"
                />
                <span class="input-group-append">
                                         <button class="btn btn-outline-secondary" type="button" th:attr="tabindex=${nativeEntryDate ? null : 5}">
                                             <!-- https://www.w3schools.com/icons/fontawesome5_icons_datetime.asp -->
                                             <i class="far fa-calendar" aria-hidden="true"></i>
                                         </button>
                                </span>
            </div>
        </div>



        <!-- status -->
        <div class="mb-3 row">
            <span class="col-sm-3 col-form-label col-form-label-sm">Status:</span>

            <div class="d-flex flex-wrap gap-3" th:classappend="${nativeEntryDate ? 'col-sm-9' : 'col-sm-6'}">

                <label>
                    <input type="radio" th:field="*{status}" value="2" th:attr="tabindex=${nativeEntryDate ? null : 6}" aria-label="Warning">
                    <i th:unless="${nativeEntryDate}" class="fas fa-circle-exclamation" title="Warning" style="cursor: pointer; color: tomato; font-size: 1.5em;"></i>
                    <span th:if="${nativeEntryDate}">Warning</span>
                </label>

                <label>
                    <input type="radio" th:field="*{status}" value="0" th:attr="tabindex=${nativeEntryDate ? null : 7}" aria-label="Not marked">
                    <i th:unless="${nativeEntryDate}" class="fas fa-circle-dot text-secondary" title="Not Marked" style="cursor: pointer; color: gainsboro; font-size: 1.5em;"></i>
                    <span th:if="${nativeEntryDate}">Not marked</span>
                </label>

                <label>
                    <input type="radio" th:field="*{status}" value="1" th:attr="tabindex=${nativeEntryDate ? null : 8}" aria-label="Done">
                    <i th:unless="${nativeEntryDate}" class="fas fa-check-circle text-success" title="Done" style="cursor: pointer; color: palegreen; font-size: 1.5em;"></i>
                    <span th:if="${nativeEntryDate}">Done</span>
                </label>


            </div>

            <button th:unless="${nativeEntryDate}" type="submit" class="btn btn-sm btn-secondary col-sm-2" th:attr="tabindex=${nativeEntryDate ? null : 9}">Save</button>

        </div>



        <!-- NOTE CONTENT -->


        <div class="mb-3 row">
            <!-- markdown easymde -->
            <label for="note_content" class="col-sm-2 col-form-label col-form-label-sm">Note:</label>
            <div class="col-sm-9">
                <textarea th:field="*{note.content}" id="note_content" rows="8" class="form-control"
                          th:attr="tabindex=${nativeEntryDate ? null : 10},autofocus=${nativeEntryDate ? null : 'autofocus'}"></textarea>
            </div>
        </div>
        <button th:if="${nativeEntryDate}" type="submit" class="btn btn-primary mb-3">Save entry</button>
        </fieldset>
    </form>


    <a th:if="${entryListReturnPath != null}" th:href="@{${entryListReturnPath}}" class="btn btn-outline-secondary">
        Cancel
    </a>
    <form th:if="${topicEntryForm != true and entryListReturnPath == null}" th:action="@{/entries/redirect}" id="cancelForm" method="post">
        <!-- dateMillisYmd (artık gizli) -->
        <input type="hidden" name="dateMillisYmd" th:value="${entry.dateMillisYmd}" />
        <input type="hidden" name="returnPage" th:value="${returnPage}">
        <input type="hidden" name="categoryId" th:value="${categoryId}" th:if="${categoryId}">
        <input type="hidden" name="entryId" th:value="${entry.id}" th:if="${entry.id != null}">
        <input type="hidden" name="topicId" th:value="${entry.topic.id}" th:if="${entry.topic != null}">
        <input type="hidden" name="categoryGroupId" th:value="${categoryGroupId}" th:if="${entry.topic != null}">
        <button type="submit" class="btn btn-sm btn-secondary col-sm-2" tabindex="11">Cancel</button>


    </form>


    <!-- Eğer entry.id null değilse, bir "Delete" linki göster -->
    <form th:if="${entry.id != null and entryListReturnPath != null}"
          th:action="@{/entries/delete/{id}(id=${entry.id})}" method="post" class="mt-3"
          onsubmit="return confirm('Delete this entry?')">
        <input type="hidden" name="returnPage" value="entryList">
        <th:block th:fragment="entryListFields">
            <input th:if="${entryListLocation.listTopicId != null}" type="hidden" name="listTopicId"
                   th:value="${entryListLocation.listTopicId}">
            <input type="hidden" name="listPage" th:value="${entryListLocation.listPage}">
            <input type="hidden" name="listSize" th:value="${entryListLocation.listSize}">
        </th:block>
        <button type="submit" class="btn btn-outline-danger">Delete entry</button>
    </form>

    <div th:if="${entry.id != null and entryListReturnPath == null}" class="mt-3">

        <a th:href="@{/entries/delete/{id}(
                                            id=${entry.id},
                                            categoryId=${categoryId},
                                            topicId=${entry.topic.id},
                                            returnPage=${returnPage}
                                            )}"
           onclick="return confirm('Bu kaydı silmek istediğinize emin misiniz?');"
           class="btn btn-sm btn-danger col-sm-3" tabindex="12">
            Delete Entry
        </a>
    </div>


</div>

cunku zannedersem webjar locator kutuphanesi bunu versiyonsuz bulamiyor.

<script type="text/javascript" th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>

<script type="text/javascript"
        th:src="@{/webjars/bootstrap/5.3.7/js/bootstrap.min.js}"></script>
</body>

<script type="text/javascript" th:src="@{/webjars/bootstrap-datepicker/dist/js/bootstrap-datepicker.js}"></script>

<noscript>
    Please enable JavaScript.
</noscript>
<script>
    // Webbrowser'in back dugmesine tiklandiginda bu sayfadaki cancelForm dugmesine
    // tiklanmasini saglayan script. Cunku geldigi sayfa geri gidince calismaya uygun olmayabiliyor.
    // Ama bu yolla istenildigi bicimde tracker sayfasina donmus oluyor.
    if (performance.navigation.type === 2) { // 2 = Back/Forward
        const form = document.getElementById('cancelForm');
        if (form) form.submit();
    }
</script>



<script>
    /**
     * Date Picker’da tarih seçilince,
     * seçili tarihi (yyyy-MM-dd) milisaniyeye çevirip
     * dateMillisYmd input’una yazan basit fonksiyon.
     */
    function convertDateToEpoch() {
        const selectedDate = document.getElementById('entryDatePicker').value; // yyyy-MM-dd
        if (selectedDate) {
            const [year, month, day] = selectedDate.split('-');
            const dateObj = new Date(year, month - 1, day);
            const epochMillis = dateObj.getTime();
            document.getElementById('dateMillisYmd').value = epochMillis;
        }
    }

    /** https://uxsolutions.github.io/bootstrap-datepicker/
    * "0,6" means: 0 is Sunday, 6 is Saturday. Comma separated, not range.
    * calendarWeeks 20 gostermesi gerekirken 21 gosterdi Pazar gunu, disable ettim.  https://www.epochconverter.com/weeknumbers
    */

        $(function() {
          $('#entryDateContainer .entryDateStyle.date').datepicker({
              format: "yyyy-mm-dd",
              todayBtn: "linked",
              daysOfWeekHighlighted: "0,6",
              calendarWeeks: false,
              autoclose: true,
              todayHighlight: true
          });
      });




    /**
     * Kategori seçimi veya arama metni değiştiğinde
     * selectbox içindeki 'option'ları filtrele
     */

let allTopics = [];

document.addEventListener('DOMContentLoaded', () => {

    const topicSelect = document.getElementById('topicSelect');
    if (!topicSelect) return;

    // İlk optionları hafızaya al
    allTopics = Array.from(topicSelect.options).map(option => ({
        value: option.value,
        text: option.textContent
    }));
});

    function filterTopics() {

        const searchText =
            document.getElementById('topicSearch')
                .value
                .toLowerCase();

        const topicSelect =
            document.getElementById('topicSelect');

        // Select içini temizle
        topicSelect.innerHTML = '';

        // Filtrelenmiş optionları tekrar ekle
        allTopics.forEach(topic => {

            const matches =
                !searchText ||
                topic.text.toLowerCase().includes(searchText);

            if (matches) {

                const option = document.createElement('option');

                option.value = topic.value;
                option.textContent = topic.text;

                topicSelect.appendChild(option);
            }
        });
    }

    async function loadTopicsByCategory(categoryId) {
        // Kategori seçimi boşaldıysa topic listesini temizleyebilir veya tüm topicleri tekrar çağırabilirsiniz.
        if (!categoryId) {
            clearTopicSelect();
            return;
        }

        try {

            const response =
                await fetch('/entries/api/topicsByCategory?categoryId=' + categoryId);

            if (!response.ok)
                throw new Error('Topic listesi çekilemedi.');

            const data = await response.json(); // JSON array of topics

            populateTopicSelect(data);

            // Yeni listeyi hafızaya al
            const topicSelect = document.getElementById('topicSelect');

            allTopics = Array.from(topicSelect.options).map(option => ({
                value: option.value,
                text: option.textContent
            }));

            filterTopics(); // kategori degistigi icin arama kutusu filtresini yeni topiclere gore tekrar calistiriyoruz.

        } catch (err) {
            console.error(err);
        }
    }

    // topicSelect'i temizle
    function clearTopicSelect() {
        const topicSelect = document.getElementById('topicSelect');
        topicSelect.innerHTML = ''; // tüm option'ları sil
    }

    // topicSelect'i gelen verilerle güncelle
    function populateTopicSelect(topics) {
        const topicSelect = document.getElementById('topicSelect');
        topicSelect.innerHTML = '';

        topics.forEach(topic => {
            const option = document.createElement('option');
            option.value = topic.id;
            option.textContent = topic.name;
            topicSelect.appendChild(option);
        });
    }
</script>

<script src="/webjars/easymde/2.18.0/dist/easymde.min.js"></script>
<!--/*
    easymde'nin toolbar ayarında nelerin görünmesi gerektiğini manuel olarak yazıyoruz
    (dışarıdan bakıldığında default görünüm),
    çünkü link ekleme düğmesinin işlevini kendi fonksiyonumuzla değiştirdik. Artık köşeli parantez içine alıyor.
    Benzer şekilde image ekleme işlevini de değiştirdik. ![](image url) içine alıyor. Online resimler görünür oluyor.
    Toolbar disindaki metod Paste event yakalar yani clipboarddan yapıştırma yapılırsa aşağıdaki
    kurala göre işlem yapar metin üzerinde.
    Fakat onu devredışı bıraktık çünkü image link de ekleyebiliyoruz ve onda zorluk çıkarıyor, yoksa kolaylık idi.
    Burada yaptırdığımıza şey, yapıştırılan metin https veya http ile başlıyorsa köşe parantez ile çevrelemesi.
    Böylece markdown link haline gelir.
    https://github.com/Ionaru/easy-markdown-editor
*/-->
<script>
    var easyMDE = new EasyMDE({
        element: document.getElementById("note_content"),
        spellChecker: false,
        forceSync: true, // <-- onemli: EasyMDE icerigini textarea ile senkronize eder
        indentWithTabs: false,
        toolbar: [
            "bold", "italic", "heading",
            "|",
            "quote", "unordered-list", "ordered-list",
            "|",
            { // custom actionumuz
                name: "link",
                action: function customLink(editor){
                    var cm = editor.codemirror;
                    var selection = cm.getSelection();
                    if (/^https?:\/\//.test(selection)) {
                        cm.replaceSelection("<" + selection + ">");
                    } else {
                        cm.replaceSelection("<https://>");
                        cm.setCursor(cm.getCursor().line, cm.getCursor().ch - 1);
                    }
                },
                className: "fa fa-link",
                title: "Insert autolink"
            },
            { // custom actionumuz
                name: "image",
                action: function customImage(editor){
                            var cm = editor.codemirror;
                            var selection = cm.getSelection();
                            if (/^https?:\/\//.test(selection)) {
                                cm.replaceSelection("![](" + selection + ")");
                            } else {
                                cm.replaceSelection("![](https://)");
                                cm.setCursor(cm.getCursor().line, cm.getCursor().ch - 1);
                            }
                        },
                className: "fa fa-image",
                title: "Insert image"
            },
            "preview", "fullscreen",
            "|",
            "guide"
        ]
    });

    // Paste event yakalar fakat devredisi biraktim cunku link yerine, image link eklemek istenirse zorluk olmasin.
    /*
    easyMDE.codemirror.on("paste", function(cm, event) {
        let clipboardData = (event.clipboardData || window.clipboardData);
        let pastedText = clipboardData.getData("text");

        // Eğer sadece URL yapıştırıldıysa
        if (/^https?:\/\/[^\s]+$/.test(pastedText)) {
            event.preventDefault();
            cm.replaceSelection("<" + pastedText + ">");
        }
    });
    */

    /*
    easyMDE.codemirror.addKeyMap({
        "Tab": function(cm) {
            cm.getInputField().blur();
        },
        "Ctrl-Right": function() {
            moveStatus(1);
        },

            moveStatus(-1);
        },
        "Ctrl-Enter": function() {

        }

</script>

<script>
    document.addEventListener('DOMContentLoaded', function () {

        let lastFocusedElement = document.activeElement;

        // Focus takibi
        document.addEventListener('focusin', function (e) {
            lastFocusedElement = e.target;
        });

        const statusRadios = Array.from(
            document.querySelectorAll('input[name="status"]')
        );

        const saveButton = document.querySelector('button[type="submit"]');

        function restoreFocus() {
            if (
                lastFocusedElement &&
                document.contains(lastFocusedElement) &&
                !statusRadios.includes(lastFocusedElement)
            ) {
                setTimeout(() => {
                    lastFocusedElement.focus();
                }, 0);
            }
        }

        function moveStatus(direction) {

            const currentIndex = statusRadios.findIndex(r => r.checked);

            let newIndex = currentIndex + direction;

            if (newIndex < 0) {
                newIndex = statusRadios.length - 1;
            }

            if (newIndex >= statusRadios.length) {
                newIndex = 0;
            }

            statusRadios[newIndex].checked = true;

            statusRadios[newIndex].dispatchEvent(
                new Event('change', { bubbles: true })
            );

            restoreFocus();
        }

        document.addEventListener('keydown', function (e) {

            if (!e.ctrlKey) {
                return;
            }

            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                moveStatus(-1);
            }

            if (e.key === 'ArrowRight') {
                e.preventDefault();
                moveStatus(1);
            }

            if (e.key === 'Enter') {
                e.preventDefault();
                saveButton.click();
            }
        });
    });
</script>




</html>
